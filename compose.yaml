services:
  frontproxy:
    build:
      context: frontproxy
    ports:
      - '8000:8000'
    depends_on:
      - alloy
      - frontend
    volumes:
      - ./frontproxy/nginx.conf:/etc/nginx/nginx.conf

  frontend:
    build: frontend
    environment:
      - PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      - products

  products:
    build:
     context: products
    ports:
      - '8002:8002'
    volumes:
      - ./products/app.py:/app/app.py
    depends_on:
      - redis

  checkout:
    build:
      context: checkout
    ports:
      - '8003:8003'

  redis:
     image: redis:alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
     ports:
       - '6379:6379'

  alloy:
    image: grafana/alloy@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
    ports:
      - '12345:12345'

  load:
    build:
      context: load
      dockerfile: Dockerfile
    volumes:
      - ./load/script.js:/etc/script.js
    command: run /etc/script.js
    restart: always
    depends_on:
      frontproxy:
        condition: service_started
